name: PTSCPS homepage Speed Index slider filmstrip audit
on:
  push:
    branches: [main]
    paths: [".github/workflows/ptscps-home-slider-si-audit.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        device: [desktop, mobile]
    env:
      SI_DEVICE: ${{ matrix.device }}
      SI_CYCLES: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Lighthouse and Chromium
        run: |
          npm install --no-save --no-audit --no-fund lighthouse@13.5.0 playwright
          npx playwright install --with-deps chromium
      - name: Capture real Lighthouse SI and filmstrip with slider requests
        run: |
          node --check scripts/ptscps-home-slider-si-lighthouse.cjs
          node scripts/ptscps-home-slider-si-lighthouse.cjs > slider-si-lh.log 2>&1 || { tail -n 32 slider-si-lh.log; exit 1; }
          grep '^SLIDER_SI_LH' slider-si-lh.log | cut -c1-12000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ptscps-slider-si-${{ matrix.device }}-filmstrip
          path: |
            si-slider-lh-${{ matrix.device }}/
            slider-si-lh.log
          retention-days: 14
          if-no-files-found: ignore

