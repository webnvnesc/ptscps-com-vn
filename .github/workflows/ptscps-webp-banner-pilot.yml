name: PTSCPS old fixed 3-banner WebP deploy (deprecated, read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  migration-notice:
    runs-on: ubuntu-24.04
    steps:
      - name: Explain replacement workflow without changing production
        run: |
          echo "Fixed 3-banner WebP deploy is retired."
          echo "Production now uses automatic WebP generation and generic uploads negotiation."
          echo "Deploy/verify with ptscps-webp-autogen-deploy.yml."
          echo "Rollback with ptscps-webp-autogen-rollback.yml."
          echo "No production files have been changed by this legacy workflow."
