name: PTSCPS Jannah CSS preload A/B (browser only)
on:
  push:
    branches: [main]
    paths: [".github/workflows/ptscps-preload-style-ab.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: fixed
            width: 412
            cycles: 7
          - mode: live
            width: 412
            cycles: 6
          - mode: fixed
            width: 1440
            cycles: 4
    env:
      TEST_MODE: ${{ matrix.mode }}
      TEST_WIDTH: ${{ matrix.width }}
      TEST_CYCLES: ${{ matrix.cycles }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Compare preload hint vs original browser-only
        shell: bash
        run: |
          node --check scripts/ptscps-preload-style-ab.cjs
          node scripts/ptscps-preload-style-ab.cjs > preload.log 2>&1 || { tail -n 35 preload.log; exit 1; }
          grep -E '^(STATS|PRELOAD_TARGET|FATAL)' preload.log | cut -c1-12000
      - name: Save measured results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ptscps-style-preload-ab-${{ matrix.mode }}-${{ matrix.width }}
          path: |
            preload-results/
            preload.log
          retention-days: 10
          if-no-files-found: warn
