name: PTSCPS bounded PHP vs static origin diagnostic (temporary file, cleanup)
on:
  push:
    branches: [main]
    paths: [".github/workflows/ptscps-temporary-origin-php-probe.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ptscps-production-css
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate script and FTP credentials presence
        run: |
          python3 -m py_compile scripts/ptscps-temporary-origin-php-probe.py
          test -n "$FTP_SERVER" && test -n "$FTP_USERNAME" && test -n "$FTP_PASSWORD"
      - name: Measure bounded real static vs temporary PHP endpoint and always clean up
        run: |
          python3 -u scripts/ptscps-temporary-origin-php-probe.py > origin-probe.log 2>&1 || { tail -n 36 origin-probe.log; exit 1; }
          grep '^PROBE_SUMMARY\|^PROBE_CLEANUP' origin-probe.log | cut -c1-4000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ptscps-origin-readonly-compare
          path: |
            origin-probe.log
            ptscps-origin-php-probe/
          retention-days: 10
          if-no-files-found: ignore
