name: PTSCPS JS assets by route and viewport (read-only)
on:
  push:
    branches: [main]
    paths: [".github/workflows/ptscps-js-demand-loading-audit.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        shell: bash
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Inventory JS loaded per route and scroll
        shell: bash
        run: |
          node --check scripts/ptscps-js-demand-loading-audit.cjs
          node scripts/ptscps-js-demand-loading-audit.cjs > ptscps-js-audit.log 2>&1 || { tail -n 30 ptscps-js-audit.log; exit 1; }
          grep -E '^JS_AUDIT_(PAGE|FILES|SUMMARY)' ptscps-js-audit.log | cut -c1-26000
      - name: Archive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ptscps-js-by-page-audit
          path: |
            ptscps-js-audit.log
            ptscps-js-audit.json
          retention-days: 12
          if-no-files-found: warn
