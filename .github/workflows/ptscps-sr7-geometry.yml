name: PTSCPS slider native geometry with JS enabled and disabled
on:
  push:
    branches: [main]
    paths: [".github/workflows/ptscps-sr7-geometry.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Inspect actual slider size before JavaScript
        run: node scripts/ptscps-sr7-geometry.cjs
