name: PTSCPS inspect targeted WP Super Cache entries (read only)
on:
  push:
    branches: [main]
    paths: [".github/workflows/ptscps-supercache-target-inspect.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect only cached homepage/category file names
        run: python3 -u scripts/ptscps-supercache-target-inspect.py
