name: PTSCPS two scaled carousel JPEG WebP production fix
on:
  push:
    branches: [main]
    paths: [".github/workflows/ptscps-customer-scaled-webp-live.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ptscps-production-image-pilot
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Pillow and Chromium
        run: |
          python3 -m pip install --disable-pip-version-check pillow
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Validate exact scripts
        run: |
          python3 -m py_compile scripts/ptscps-customer-webp-scaled-backfill.py
          node --check scripts/ptscps-customer-scaled-webp-live-qa.cjs
      - name: Generate exactly two missing scaled JPEG WebP sidecars through FTPS
        run: |
          python3 -u scripts/ptscps-customer-webp-scaled-backfill.py deploy > customer-scaled-deploy.log 2>&1 || { tail -n 30 customer-scaled-deploy.log; exit 1; }
          grep '^CUSTOMER_WEBP_SCALED_DEPLOY_SUMMARY' customer-scaled-deploy.log
      - name: Verify actual WebP delivery and original JPEG fallback on phone and desktop
        run: |
          node scripts/ptscps-customer-scaled-webp-live-qa.cjs > customer-scaled-live.log 2>&1 || { tail -n 28 customer-scaled-live.log; exit 1; }
          grep '^CUSTOMER_SCALED_WEBP_SUMMARY' customer-scaled-live.log
      - name: Roll back only two newly generated WebPs on failure
        if: failure()
        run: python3 -u scripts/ptscps-customer-webp-scaled-backfill.py rollback
      - name: Archive sidecar checksums and network evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ptscps-scaled-customer-webp-evidence
          path: |
            customer-webp-scaled-created.json
            customer-scaled-deploy.log
            customer-scaled-live.log
            customer-scaled-webp-http.json
          retention-days: 30
          if-no-files-found: ignore
