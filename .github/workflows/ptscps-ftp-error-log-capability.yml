name: PTSCPS secure FTPS Apache log capability (read-only)
on:
  push:
    branches: [main]
    paths: [".github/workflows/ptscps-ftp-error-log-capability.yml", "scripts/ptscps-ftp-error-log-capability.py"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate read-only FTPS inspection
        run: |
          python3 -m py_compile scripts/ptscps-ftp-error-log-capability.py
          python3 -u scripts/ptscps-ftp-error-log-capability.py
