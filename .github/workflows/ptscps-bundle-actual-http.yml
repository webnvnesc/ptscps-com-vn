name: PTSCPS actual static CSS bundle HTTP A/B
on:
  push:
    branches: [main]
    paths: [".github/workflows/ptscps-bundle-actual-http.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: fixed
            width: 412
            cycles: 7
          - mode: live
            width: 412
            cycles: 6
          - mode: fixed
            width: 1440
            cycles: 4
    env:
      TEST_MODE: ${{ matrix.mode }}
      TEST_WIDTH: ${{ matrix.width }}
      TEST_CYCLES: ${{ matrix.cycles }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Compare real hosted CSS vs original site
        shell: bash
        run: |
          node --check scripts/ptscps-css-bundle-actual-http.cjs
          mkdir -p bundle-repeat-results
          node scripts/ptscps-css-bundle-actual-http.cjs > bundle-repeat-results/log.txt 2>&1 || { tail -n 45 bundle-repeat-results/log.txt; exit 1; }
          grep -E '^(STATS|BUNDLE|REJECT|FATAL)' bundle-repeat-results/log.txt | cut -c1-10000
      - name: Upload screenshots and measurement output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ptscps-real-css-a-b-${{ matrix.mode }}-${{ matrix.width }}
          path: bundle-repeat-results/
          retention-days: 10
          if-no-files-found: warn
