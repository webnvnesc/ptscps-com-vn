name: PTSCPS SR7 native script setting source check
on:
  push:
    branches: [main]
    paths: [".github/workflows/ptscps-sr7-native-option-context.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Read exact SR7 source ranges
        shell: bash
        run: |
          python3 -u scripts/ptscps-sr7-native-option-context.py > sr7-native-source.log 2>&1 || { tail -n 20 sr7-native-source.log; exit 1; }
          grep '^CODE ' sr7-native-source.log | cut -c1-26000
      - name: Keep code excerpts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ptscps-sr7-native-option-source
          path: sr7-native-source.log
          retention-days: 10
