name: PTSCPS logo requests mobile A/B (read only)
on:
  push:
    branches: [main]
    paths: [".github/workflows/ptscps-logo-network-ab.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    env:
      LOGO_AB_PAIRS: '5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright cheerio@1.0.0
          npx playwright install --with-deps chromium
      - name: Measure unmodified page vs image-request suppression in mobile
        run: |
          node --check scripts/ptscps-logo-network-ab.cjs
          node scripts/ptscps-logo-network-ab.cjs > ptscps-logo-network-ab.log 2>&1 || { tail -n 25 ptscps-logo-network-ab.log; exit 1; }
          grep '^LOGO_AB_SUMMARY' ptscps-logo-network-ab.log | cut -c1-18000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ptscps-logo-network-ab
          path: |
            ptscps-logo-network-ab.log
            ptscps-logo-network-ab/
          retention-days: 14
          if-no-files-found: ignore
