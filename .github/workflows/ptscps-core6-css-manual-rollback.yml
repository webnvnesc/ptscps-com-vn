name: PTSCPS manual rollback Jannah core6 CSS (exact hash)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ptscps-production-css
  cancel-in-progress: false
jobs:
  rollback:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
      WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate rollback script
        run: python3 -m py_compile scripts/ptscps-core6-manual-rollback.py
      - name: Delete only checksum-verified canary files by encrypted FTPS
        run: python3 -u scripts/ptscps-core6-manual-rollback.py
      - name: Prepare browser for HTML cache purge
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Purge WP Super Cache after disabling CSS bundle
        run: node scripts/ptscps-wpsc-clear-html-cache.cjs
