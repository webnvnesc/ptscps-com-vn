name: PTSCPS image optimization production QA (no writes)
on:
  push:
    branches: [main]
    paths: [".github/workflows/ptscps-image-postdeploy-qa.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        width: [412, 1440]
    env:
      TEST_WIDTH: ${{ matrix.width }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Verify image requests, carousel scroll and category thumbnails
        run: |
          node --check scripts/ptscps-image-postdeploy-qa.cjs
          node scripts/ptscps-image-postdeploy-qa.cjs > image-postdeploy.log 2>&1 || { tail -n 35 image-postdeploy.log; exit 1; }
          grep '^PASS ' image-postdeploy.log | cut -c1-4000
      - name: Archive screenshot and runtime metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ptscps-images-production-qa-${{ matrix.width }}
          path: |
            image-postdeploy-${{ matrix.width }}/
            image-postdeploy.log
          retention-days: 10
          if-no-files-found: warn
