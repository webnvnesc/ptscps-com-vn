name: PTSCPS inspect precise SR7 first slide HTML layout
on:
  push:
    branches: [main]
    paths: [".github/workflows/ptscps-sr7-exact-first-slide.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact first-slide HTML
        run: |
          python3 -u scripts/ptscps-sr7-exact-first-slide.py > exact-slide.log 2>&1
          grep '^SR7_EXACT' exact-slide.log | cut -c1-15000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ptscps-sr7-exact-first-slide
          path: exact-slide.log
          retention-days: 10
