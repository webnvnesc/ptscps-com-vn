name: PTSCPS SR7 exact image extraction source read only
on:
  push:
    branches: [main]
    paths: [".github/workflows/ptscps-sr7-exact-image-model.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect image resolution in native SR7
        run: |
          python3 -u scripts/ptscps-sr7-exact-image-model.py > sr7-exact-image-source.log 2>&1
          grep '^SR7_EXCERPT' sr7-exact-image-source.log | cut -c1-12000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ptscps-sr7-exact-image-model
          path: sr7-exact-image-source.log
          retention-days: 7
