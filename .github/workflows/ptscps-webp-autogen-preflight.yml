name: PTSCPS WebP dynamic migration safe root preflight
on:
  push:
    branches: [main]
    paths: [".github/workflows/ptscps-webp-autogen-preflight.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect uploads rules without downloading or changing unrelated files
        run: python3 -u scripts/ptscps-webp-autogen-preflight.py
