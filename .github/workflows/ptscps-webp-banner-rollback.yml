name: PTSCPS legacy WebP rollback (restore 3-banner baseline)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ptscps-production-image-pilot
  cancel-in-progress: false
jobs:
  rollback:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python3 -m pip install --disable-pip-version-check pillow
      - name: Safely restore baseline 3-banner policy from dynamic WebP
        run: |
          python3 -u scripts/ptscps-webp-autogen-deploy.py rollback
          python3 -u scripts/ptscps-webp-banner-http-qa.py
