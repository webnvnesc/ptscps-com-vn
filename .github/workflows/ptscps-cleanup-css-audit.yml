name: PTSCPS remove inactive Jannah CSS audit asset
on:
  push:
    branches: [main]
    paths: [".github/workflows/ptscps-cleanup-css-audit.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Delete only known checksum CSS audit asset
        run: python3 -u scripts/cleanup-staged-jannah-css.py
