name: PTSCPS fast inspect Jannah header logo template
on:
  push:
    branches: [main]
    paths: [".github/workflows/ptscps-jannah-logo-fast-readonly.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Locate Jannah logo template without making changes
        run: |
          python3 -u scripts/ptscps-jannah-logo-fast-readonly.py > logo-fast-source.log 2>&1
          grep '^JANN_FAST_' logo-fast-source.log | cut -c1-20000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ptscps-jannah-logo-template
          path: logo-fast-source.log
          retention-days: 7
