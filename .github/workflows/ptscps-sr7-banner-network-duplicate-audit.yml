name: PTSCPS read-only first SR7 poster duplicate network audit
on:
  push:
    branches: [main]
    paths: [".github/workflows/ptscps-sr7-banner-network-duplicate-audit.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BANNER_FETCH_PAIRS: '3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium browser
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Trace real network requests on the unchanged production homepage
        run: |
          node --check scripts/ptscps-sr7-banner-network-duplicate-audit.cjs
          node scripts/ptscps-sr7-banner-network-duplicate-audit.cjs > ptscps-banner-network-audit.log 2>&1 || { tail -n 18 ptscps-banner-network-audit.log; exit 1; }
          grep '^BANNER_FETCH_SUMMARY' ptscps-banner-network-audit.log | cut -c1-15000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ptscps-first-banner-double-fetch-audit
          path: |
            ptscps-first-banner-double-fetch-audit/
            ptscps-banner-network-audit.log
          retention-days: 10
          if-no-files-found: ignore
