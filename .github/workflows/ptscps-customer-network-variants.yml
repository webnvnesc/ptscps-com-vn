name: PTSCPS customer slider actual network variants audit (read-only)
on:
  push:
    branches: [main]
    paths: [".github/workflows/ptscps-customer-network-variants.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chrome
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Inspect actual JPG/PNG transfers from carousel and compare srcset variants
        run: |
          node --check scripts/ptscps-customer-network-variants-audit.cjs
          node scripts/ptscps-customer-network-variants-audit.cjs > customer-network-variants.log 2>&1 || { tail -n 20 customer-network-variants.log; exit 1; }
          grep '^CUSTOMER_NETWORK_SUMMARY' customer-network-variants.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ptscps-customer-network-variants
          path: |
            customer-network-variants.json
            customer-network-variants.log
          retention-days: 14
