name: PTSCPS A/B direct Exo CSS without WebFont Loader
on:
  push:
    branches: [main]
    paths: [".github/workflows/ptscps-exo-direct-ab.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Compare original versus stylesheet injected before render
        run: |
          node --check scripts/ptscps-exo-direct-browser-ab.cjs
          node scripts/ptscps-exo-direct-browser-ab.cjs > exo-ab.log 2>&1 || { tail -n 20 exo-ab.log; exit 1; }
          grep '^EXO_AB' exo-ab.log | cut -c1-6500
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ptscps-exo-direct-ab
          path: exo-ab.log
          retention-days: 10
