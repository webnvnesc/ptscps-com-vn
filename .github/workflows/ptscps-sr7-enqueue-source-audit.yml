name: PTSCPS SR7 enqueue source read-only audit
on:
  push:
    branches: [main]
    paths: [".github/workflows/ptscps-sr7-enqueue-source-audit.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Scan Slider Revolution PHP enqueue and hooks
        shell: bash
        run: |
          python3 -m py_compile scripts/ptscps-sr7-enqueue-source-audit.py
          python3 -u scripts/ptscps-sr7-enqueue-source-audit.py > sr7-source.log 2>&1 || { tail -n 30 sr7-source.log; exit 1; }
          grep -E '^SR7_(ASSET_SOURCE|OTHER_FILES)' sr7-source.log | cut -c1-28000
      - name: Archive source findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ptscps-sr7-enqueue-source-audit
          path: sr7-source.log
          retention-days: 10
