name: PTSCPS audit live WP Super Cache mobile configuration read only
on:
  push:
    branches: [main]
    paths: [".github/workflows/ptscps-wpsc-mobile-readonly.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect WP Super Cache settings and routing read only
        run: |
          python3 -u scripts/ptscps-wpsc-mobile-readonly.py
