name: PTSCPS inspect WebFont Loader source in current HTML
on:
  push:
    branches: [main]
    paths: [".github/workflows/ptscps-webfont-source-readonly.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Exo font loader and raw HTML
        run: |
          python3 -u scripts/ptscps-webfont-source-readonly.py > webfont-source.log 2>&1
          grep '^FONT_HTML' webfont-source.log | cut -c1-14500
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ptscps-webfont-source
          path: webfont-source.log
          retention-days: 14
